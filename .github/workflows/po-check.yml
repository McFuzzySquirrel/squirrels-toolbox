name: Po tag check

on:
  pull_request:
    paths:
      - "collection/skills/**"
      - ".github/scripts/check_po_tag.py"
      - ".github/workflows/po-check.yml"

permissions:
  contents: read

jobs:
  po-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Po metadata on new skills
        run: python3 .github/scripts/check_po_tag.py "origin/${{ github.base_ref }}"
